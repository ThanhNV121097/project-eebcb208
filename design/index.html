<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hello-word-D</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #000000;
      --muted: #666666;
      --ring: #000000;
    }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      box-sizing: border-box;
    }
    .greeting {
      font-size: clamp(3rem, 12vw, 8rem);
      line-height: 0.95;
      font-weight: 700;
      letter-spacing: -0.06em;
      text-align: center;
      margin: 0;
    }
    .hint {
      position: fixed;
      left: 16px;
      bottom: 16px;
      font-size: 12px;
      color: var(--muted);
      user-select: none;
    }
    :focus-visible {
      outline: 3px solid var(--ring);
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main class="screen" aria-label="Greeting screen">
    <h1 class="greeting">Hello Word</h1>
  </main>
  <div class="hint" aria-hidden="true">White screen · centered black text</div>
</body>
</html>
